name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # libvmloader.so & co. are native executables shipped as jniLibs. Gradle does not build them, so a stale prebuilt loader would be
      # packaged as-is: rebuild them here (zig is the cross compiler, see tools/build_native.sh) so the APK always matches native/*.c.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build native loader (arm64-v8a + x86_64)
        run: |
          pip install ziglang
          bash tools/build_native.sh

      - name: Install Android SDK packages
        run: |
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk OpenVM-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: OpenVM-debug-apk
          path: OpenVM-debug.apk

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: OpenVM-debug.apk
